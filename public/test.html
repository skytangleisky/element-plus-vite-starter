<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- 定义一个天空背景 -->
      <a-sky color="#ECECEC"></a-sky>
      
      <!-- 添加一个红色立方体 -->
      <a-box 
        position="0 1 -3" 
        rotation="0 45 0" 
        color="#FF0000">
      </a-box>

      <!-- 添加一个绿色球体 -->
      <a-sphere 
        position="1 1.5 -4" 
        radius="0.5" 
        color="#00FF00">
      </a-sphere>

      <!-- 添加一个黄色平面 -->
      <a-plane 
        position="0 0 -4" 
        rotation="-90 0 0" 
        width="4" 
        height="4" 
        color="#FFFF00">
      </a-plane>
    </a-scene>
  </body>
</html>
